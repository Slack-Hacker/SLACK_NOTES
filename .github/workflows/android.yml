name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Web Production Bundle
        run: |
          cd frontend
          npm run build

      - name: Copy Assets to Android Native Shell
        run: |
          cd frontend
          npx cap copy android

      - name: Ensure Cordova Variables Script Exists
        run: |
          mkdir -p frontend/android/capacitor-cordova-android-plugins
          echo "ext {}" > frontend/android/capacitor-cordova-android-plugins/cordova.variables.gradle

      - name: Fix Line Endings and Build Debug APK
        run: |
          cd frontend/android
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace || (
            ./gradlew assembleDebug --stacktrace -q 2>&1 | head -n 30 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          )

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlackNotes-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
